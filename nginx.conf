server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
    }

    location = /llms.txt {
        add_header Content-Type text/plain;
    }

    location = /sitemap.xml {
        add_header Content-Type application/xml;
    }

    location = /og-image.png {
        add_header Content-Type image/png;
    }
}
